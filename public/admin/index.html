<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin DEBUG — Caelis Galeria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #1a1a1a; color: #0f0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #0f0; margin-bottom: 20px; }
    .log { background: #000; padding: 20px; border: 1px solid #0f0; border-radius: 8px; margin-bottom: 20px; max-height: 400px; overflow-y: auto; }
    .log-entry { margin-bottom: 8px; font-size: 13px; }
    .log-entry.error { color: #f00; }
    .log-entry.success { color: #0f0; }
    .log-entry.info { color: #0ff; }
    .data { background: #000; padding: 20px; border: 1px solid #0f0; border-radius: 8px; }
    pre { white-space: pre-wrap; word-wrap: break-word; font-size: 12px; }
    button { padding: 10px 20px; background: #0f0; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; }
    button:hover { background: #0a0; }
    .btn-danger { background: #f00; color: #fff; }
    .btn-danger:hover { background: #a00; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Admin Panel DEBUG MODE</h1>
    <button onclick="testAPI()">Test API</button>
    <button onclick="testCORS()">Test CORS</button>
    <button onclick="clearLog()" class="btn-danger">Clear Log</button>
    <div class="log" id="log"></div>
    <div class="data">
      <h2>Raw API Response:</h2>
      <pre id="data"></pre>
    </div>
  </div>
  <script>
    const WORKER_URL = 'https://caelis-subscribe-production.shufang0026.workers.dev';
    let logs = [];
    function log(msg, type='info') {
      const el = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      el.appendChild(entry);
      el.scrollTop = el.scrollHeight;
    }
    function clearLog() {
      document.getElementById('log').innerHTML = '';
      document.getElementById('data').textContent = '';
    }
    async function testAPI() {
      log('Starting API test...', 'info');
      const creds = btoa('admin:caelis-2026-admin');
      log('Auth header: Basic ' + creds.substring(0, 20) + '...', 'info');
      // Test /visitors
      log('Fetching ' + WORKER_URL + '/visitors...', 'info');
      try {
        const res = await fetch(WORKER_URL + '/visitors', {
          headers: { 'Authorization': 'Basic ' + creds, 'Content-Type': 'application/json' }
        });
        log('Response status: ' + res.status, res.ok ? 'success' : 'error');
        log('Response Content-Type: ' + res.headers.get('Content-Type'), 'info');
        const text = await res.text();
        log('Response length: ' + text.length + ' bytes', 'info');
        log('First 200 chars: ' + text.substring(0, 200), 'info');
        if (text.trim().startsWith('{')) {
          const data = JSON.parse(text);
          log('✅ JSON parsed! Total visitors: ' + data.total, 'success');
          document.getElementById('data').textContent = JSON.stringify(data, null, 2);
        } else {
          log('❌ Response is NOT JSON! Showing first 500 chars:', 'error');
          log(text.substring(0, 500), 'error');
        }
      } catch(e) {
        log('❌ Fetch error: ' + e.message, 'error');
        if (e.message.includes('CORS')) {
          log('💡 This is a CORS error! Worker needs CORS headers.', 'error');
        }
      }
    }
    async function testCORS() {
      log('Testing CORS...', 'info');
      log('Sending OPTIONS preflight request...', 'info');
      try {
        const res = await fetch(WORKER_URL + '/visitors', { method: 'OPTIONS' });
        log('OPTIONS response status: ' + res.status, res.ok ? 'success' : 'error');
        log('Access-Control-Allow-Origin: ' + res.headers.get('Access-Control-Allow-Origin'), 'info');
        if (res.headers.get('Access-Control-Allow-Origin') === '*') {
          log('✅ CORS is enabled!', 'success');
        } else {
          log('❌ CORS NOT enabled! Worker needs to add CORS headers.', 'error');
        }
      } catch(e) {
        log('❌ CORS test error: ' + e.message, 'error');
      }
    }
    log('Debug panel loaded. Click "Test API" to start.', 'info');
  </script>
</body>
</html>
